<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    body {
      font-family: "sanf-pro";
      background-color: black;
    }
    @font-face {
      font-family: "akbaal";
      src: url(./font/akbaal.ttf) format("trueType");
    }
    @font-face {
      font-family: "sanf-pro";
      src: url(./font/SF-Pro.ttf) format("trueType");
    }
    #backgroundimg {
      position: fixed;
      top: 0px;
      transform: scale(1.01);
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      opacity: 1;
      filter: blur(5px) brightness(1);
    }
    #nav {
      color: white;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 50px;
      display: flex;
      z-index: 1;
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(6px);
      transition: all 0.5s ease;
    }
  </style>
  <body>
    <img id="backgroundimg" src="../pic/neflexmusix.jpg" alt="" />
    <div id="nav">
      <h1
        style="
          font-family: akbaal;
          position: relative;
          left: 10px;
          font-size: 20px;
        "
      >
        )))
      </h1>
      <h1 style="position: relative; left: 1360px; top: -15px">🔎</h1>
    </div>
    <div id="container"></div>
  </body>
</html>
